<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>#১ খানকির ছেলে — তারিফ চৌধুরী</title>
    <meta name="description" content="#১ খানকির ছেলে — তারিফ চৌধুরী" />
    <meta property="og:title" content="#১ খানকির ছেলে — তারিফ চৌধুরী" />
    <meta property="og:description" content="খানকিরছেলে.পাতা.বাংলা" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#050507" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alkatra:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- ডাইনামিক স্কেয়ারি B&W + ক্রোম্যাটিক + ফ্লিকার ব্যাকগ্রাউন্ড -->
    <div id="scary-bg" class="scary-bg" aria-hidden="true">
      <div class="bg-layer bg-base"></div>
      <div class="bg-layer bg-base-flash"></div>
      <div class="bg-layer bg-chroma-red"></div>
      <div class="bg-layer bg-chroma-cyan"></div>
      <div class="bg-scanlines"></div>
      <div class="bg-flash"></div>
      <div class="bg-vignette"></div>
    </div>

    <!-- script.js এর পুরানো লেখা (উন্মোচিত ইত্যাদি) ব্লক করার জন্য হিডেন ডামি -->
    <div hidden aria-hidden="true">
      <span id="hero-case-tag"></span>
      <span id="hero-alias"></span>
      <span id="hero-subtitle"></span>
      <span id="info-alias"></span>
      <span id="info-status"></span>
    </div>

    <div class="top-bar" role="region" aria-label="ডোমেইন">
      <div class="top-bar-inner">
        <span class="top-bar-domain">খানকিরছেলে.পাতা.বাংলা</span>
        <span class="top-bar-tag">র‍্যাংক #১</span>
      </div>
    </div>

    <div class="page-shell">
      <main>
        <!-- এক্সপ্লয়েট / ব্রেচ স্টাইল হিরো -->
        <section class="exploit-hero" aria-labelledby="main-title">
          <div class="hero-left">
            <div class="hero-code-bar">
              <span class="code-badge">#১</span>
              <span class="code-line"></span>
            </div>

            <h1 id="main-title" class="hero-title">
              খানকির<br />ছেলে
            </h1>

            <p class="hero-target-name">তারিফ চৌধুরী</p>

            <!-- শার্প ডেটা ডাম্প টেবিল (কোনো উন্মোচিত বা এক্সট্রা লেখা নেই) -->
            <dl class="dossier-table">
              <div class="dossier-row">
                <dt>নাম</dt>
                <dd id="info-name">তারিফ চৌধুরী</dd>
              </div>
              <div class="dossier-row">
                <dt>পরিচিতি</dt>
                <dd class="text-crimson">খানকির ছেলে</dd>
              </div>
              <div class="dossier-row">
                <dt>বয়স</dt>
                <dd id="info-age">১৮</dd>
              </div>
              <div class="dossier-row">
                <dt>পজিশন</dt>
                <dd class="text-crimson">#১</dd>
              </div>
            </dl>

            <a href="#gallery-section" class="hero-cta">
              <span>ছবিগুলো দেখো</span>
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M12 5v14" />
                <path d="m19 12-7 7-7-7" />
              </svg>
            </a>
          </div>

          <!-- ডান পাশে টার্গেট ফ্রেম (tarif-1.jpg) -->
          <div class="hero-right">
            <div class="target-frame">
              <span class="corner tl" aria-hidden="true"></span>
              <span class="corner tr" aria-hidden="true"></span>
              <span class="corner bl" aria-hidden="true"></span>
              <span class="corner br" aria-hidden="true"></span>

              <div class="target-media">
                <img
                  id="hero-mugshot"
                  src="./images/tarif-1.jpg"
                  alt="তারিফ চৌধুরী"
                  class="target-img"
                />
                <div class="target-scan" aria-hidden="true"></div>
                <span class="target-stamp">#১</span>
              </div>
            </div>
          </div>
        </section>

        <!-- সরাসরি ফটো ডাম্প -->
        <section
          id="gallery-section"
          class="gallery-section"
          aria-labelledby="gallery-heading"
        >
          <div class="gallery-header">
            <h2 id="gallery-heading" class="gallery-heading">
              ছবি (<span id="photo-count">০৩</span>)
            </h2>
            <div class="gallery-header-line" aria-hidden="true"></div>
          </div>

          <div id="photo-grid" class="photo-grid"></div>
        </section>
      </main>
    </div>

    <footer class="site-footer">
      <p class="footer-text">খানকিরছেলে.পাতা.বাংলা</p>
    </footer>

    <!-- ফুলস্ক্রিন লাইটবক্স -->
    <div
      id="lightbox"
      class="lightbox-backdrop"
      role="dialog"
      aria-modal="true"
      aria-label="ছবি"
      hidden
    >
      <div class="lightbox-topbar">
        <span id="lightbox-counter" class="lightbox-counter">০১ / ০৩</span>

        <div class="lightbox-topbar-actions">
          <button id="lightbox-zoom-btn" class="lightbox-btn" type="button">
            বড় করো
          </button>
          <button
            id="lightbox-close-btn"
            class="lightbox-btn lightbox-btn-close"
            type="button"
          >
            কাটো
          </button>
        </div>
      </div>

      <div class="lightbox-stage">
        <button
          id="lightbox-prev-btn"
          class="lightbox-nav lightbox-nav-prev"
          type="button"
          aria-label="আগেরটা"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="m15 18-6-6 6-6" />
          </svg>
          <span class="lightbox-nav-text">আগেরটা</span>
        </button>

        <div id="lightbox-media-mount" class="lightbox-media-mount"></div>

        <button
          id="lightbox-next-btn"
          class="lightbox-nav lightbox-nav-next"
          type="button"
          aria-label="পরেরটা"
        >
          <span class="lightbox-nav-text">পরেরটা</span>
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="m9 18 6-6-6-6" />
          </svg>
        </button>
      </div>

      <div class="lightbox-footer">
        <p id="lightbox-caption" class="lightbox-caption"></p>
      </div>
    </div>

    <script src="./profile.js"></script>
    <script src="./script.js" defer></script>

    <!-- ডাইনামিক ব্যাকগ্রাউন্ড ও হিরো ফটো সিঙ্ক -->
    <script>
      window.addEventListener("load", () => {
        const bgRoot = document.getElementById("scary-bg");
        const mugshot = document.getElementById("hero-mugshot");
        if (!bgRoot) return;

        let bgSources = ["./images/tarif-1.jpg"];

        const setBgImage = (src) => {
          bgRoot.style.setProperty("--bg-img", `url("${src}")`);
        };
        setBgImage(bgSources[0]);

        setTimeout(() => {
          const imgs = Array.from(document.querySelectorAll("#photo-grid img"))
            .map((img) => img.getAttribute("src"))
            .filter(Boolean);

          if (imgs.length > 0) {
            bgSources = [...new Set(imgs)];
            setBgImage(bgSources[0]);
            if (mugshot) mugshot.src = bgSources[0];
          }

          if (bgSources.length > 1) {
            let idx = 0;
            setInterval(() => {
              idx = (idx + 1) % bgSources.length;
              bgRoot.classList.add("is-switching");
              setTimeout(() => {
                setBgImage(bgSources[idx]);
                bgRoot.classList.remove("is-switching");
              }, 140);
            }, 5200);
          }
        }, 350);
      });
    </script>
  </body>
</html>
